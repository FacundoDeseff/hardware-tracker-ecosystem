<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armador de PC | Hardware Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cyan: #00e5c3; --lime: #c6ff00; --panel: #1b2227; --muted: #92a0a8; }
        body { background: radial-gradient(circle at 80% 0, rgba(0,229,195,.12), transparent 30rem), #0d1114; color: #f5f7f8; }
        .navbar { background: rgba(13,17,20,.92) !important; backdrop-filter: blur(12px); }
        .builder-hero { border-left: 4px solid var(--cyan); }
        .step-link { color: var(--muted); cursor: pointer; border: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
        .step-link:hover:not(:disabled), .step-link.active { color: var(--cyan); border-bottom-color: var(--cyan); }
        .step-link.done { color: #e4f99d; }
        .step-link:disabled { color: #4b555b; cursor: not-allowed; }
        .component-panel, .summary-card { background: rgba(27,34,39,.95); border: 1px solid rgba(255,255,255,.1); }
        .summary-card { position: sticky; top: 1rem; }
        .summary-total, .component-price { color: var(--lime); }
        .component-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
        .component-card { min-height: 218px; background: #20282e; border: 1px solid rgba(255,255,255,.08); border-radius: .55rem; padding: .55rem; display: flex; flex-direction: column; transition: border-color .2s, transform .2s, background .2s; }
        .component-card:hover { border-color: var(--cyan); background: #263138; transform: translateY(-2px); }
        .component-image { width: 100%; height: 78px; object-fit: contain; background: rgba(0,0,0,.2); border-radius: .35rem; }
        .component-title { color: #fff; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }
        .tech-badge { color: #c9d2d6; border: 1px solid #4b5a61; background: #263139; font-size: .65rem; }
        .progress { height: 10px; background: #293238; }
        .progress-bar { background: linear-gradient(90deg, var(--cyan), var(--lime)); }
        .summary-item { border-bottom: 1px solid rgba(255,255,255,.1); padding: .65rem 0; }
        @media (min-width: 768px) { .component-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 1200px) { .component-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (max-width: 767px) { .step-link { font-size: .78rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom border-secondary"><div class="container"><a class="navbar-brand fw-bold text-light" href="/">Hardware Tracker</a><div class="d-flex gap-2"><a href="/seguimiento" class="btn btn-outline-warning btn-sm">Seguimiento</a><a href="/" class="btn btn-outline-info btn-sm">Buscador</a></div></div></nav>
    <main class="container py-5">
        <header class="builder-hero ps-3 mb-4"><p class="text-info text-uppercase small fw-semibold mb-1">Compra Gamer · Armado guiado</p><h1 class="display-6 fw-bold mb-2">Armador de PC</h1><p class="text-secondary mb-0">Elegí una opción en cada paso y armá tu presupuesto con ofertas reales.</p></header>
        <nav id="stepNav" class="d-flex gap-3 overflow-auto border-bottom border-secondary mb-4 pb-3" aria-label="Pasos del armado"></nav>
        <div class="row g-4"><aside class="col-lg-4 col-xl-3"><div class="summary-card rounded-3 p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Resumen del Presupuesto</h2><span id="statusBadge" class="badge text-bg-secondary">En espera</span></div><div class="mb-4"><div class="text-secondary small text-uppercase">Subtotal del armado</div><div id="totalPrice" class="display-5 fw-bold summary-total">$0</div></div><div class="mb-2 d-flex justify-content-between"><span class="text-secondary">Consumo estimado</span><strong><span id="powerUsage">150</span>W / <span id="psuCapacity">-</span></strong></div><div class="progress mb-3"><div id="powerBar" class="progress-bar" style="width:0%"></div></div><div id="compatibilityDetails" class="small text-secondary mb-3">Completá el asistente para validar el armado.</div><div id="buildList" class="small"></div><button id="saveBuild" type="button" class="btn btn-success w-100 mt-4" disabled>Guardar presupuesto</button><button id="printBuild" type="button" class="btn btn-outline-light w-100 mt-2">Imprimir Presupuesto</button></div></aside>
            <section class="col-lg-8 col-xl-9"><div id="wizardStep"></div><div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><button id="backButton" type="button" class="btn btn-outline-secondary">Atrás</button><div class="d-flex gap-2 ms-auto"><button id="skipButton" type="button" class="btn btn-outline-warning">Omitir paso</button><button id="nextButton" type="button" class="btn btn-info text-dark fw-semibold">Continuar</button></div></div></section>
        </div>
    </main>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const pasos = [
            { tipo: 'cpu', titulo: 'Procesador', hint: 'El punto de partida del armado.', placeholder: 'Ej: Ryzen 5600, i5 12400' },
            { tipo: 'motherboard', titulo: 'Motherboard', hint: 'Filtramos por el socket del procesador.', placeholder: 'Ej: B650, B760' },
            { tipo: 'ram', titulo: 'Memoria RAM', hint: 'Filtramos por la plataforma DDR compatible.', placeholder: 'Ej: DDR5 6000' },
            { tipo: 'gpu', titulo: 'Placa de Video', hint: 'Elegí la potencia gráfica del equipo.', placeholder: 'Ej: RTX 4060, RX 7600' },
            { tipo: 'psu', titulo: 'Fuente de Poder', hint: 'Solo mostramos fuentes acordes al consumo.', placeholder: 'Ej: 650W Gold' },
            { tipo: 'storage', titulo: 'Almacenamiento', hint: 'SSD y NVMe para tu sistema y juegos.', placeholder: 'Ej: SSD NVMe 1TB' },
            { tipo: 'case', titulo: 'Gabinete', hint: 'Elegí el formato y la estética del equipo.', placeholder: 'Ej: gabinete ATX mesh' },
            { tipo: 'cooler', titulo: 'Refrigeración CPU', hint: 'Un cooler adecuado mantiene el rendimiento estable.', placeholder: 'Ej: cooler AM5, water cooler' },
            { tipo: 'monitor', titulo: 'Monitor', hint: 'Completá tu setup con una pantalla.', placeholder: 'Ej: monitor 144Hz IPS' },
            { tipo: 'summary', titulo: 'Resumen final', hint: 'Revisá los componentes y el total antes de guardar.' }
        ];
        let pasoActual = 0;
        let paginaOpciones = 1;
        let opcionesCargadas = [];
        const filtrosActivos = { brand: '', socket: '', ram_type: '', searchQuery: '' };
        const seleccion = {};
        const omitidos = new Set();
        const precioARS = value => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(value || 0);
        function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }
        function toast(message, type = 'success') { const el = document.createElement('div'); el.className = `toast align-items-center text-bg-${type} border-0`; el.innerHTML = `<div class="d-flex"><div class="toast-body">${escapeHtml(message)}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`; document.getElementById('toastContainer').appendChild(el); const instance = new bootstrap.Toast(el, { delay: 3500 }); el.addEventListener('hidden.bs.toast', () => el.remove()); instance.show(); }
        function filtrosCompatibles() { const cpu = seleccion.cpu, mother = seleccion.motherboard, gpu = seleccion.gpu; filtrosActivos.socket = (mother || cpu || {}).socket || ''; filtrosActivos.ram_type = (mother || cpu || {}).ram_type || ''; return { socket: filtrosActivos.socket, ram_type: filtrosActivos.ram_type, recommended_watts: (cpu?.tdp || 0) + (gpu?.tdp || 0) + 150 }; }
        function renderNav() { document.getElementById('stepNav').innerHTML = pasos.map((paso, index) => `<button class="btn btn-link text-decoration-none p-0 step-link ${index === pasoActual ? 'active' : ''} ${seleccion[paso.tipo] ? 'done' : ''}" data-step="${index}" ${index > pasoActual ? 'disabled' : ''}>${index + 1}. ${paso.titulo}</button>`).join(''); document.querySelectorAll('.step-link').forEach(link => link.addEventListener('click', () => { const target = Number(link.dataset.step); if (target <= pasoActual) { pasoActual = target; cargarPaso(); } })); }
        function renderResumen(resultado) { document.getElementById('totalPrice').textContent = precioARS(resultado.precio_total); document.getElementById('powerUsage').textContent = resultado.consumo_estimado; document.getElementById('psuCapacity').textContent = resultado.fuente_watts || '-'; document.getElementById('powerBar').style.width = `${resultado.fuente_watts ? Math.min(100, resultado.consumo_estimado / resultado.fuente_watts * 100) : 0}%`; const badge = document.getElementById('statusBadge'), detail = document.getElementById('compatibilityDetails'); badge.className = resultado.compatible ? 'badge bg-success' : 'badge bg-danger'; badge.textContent = resultado.compatible ? 'Compatible' : 'Revisar armado'; detail.className = resultado.compatible ? 'small text-success mb-3' : 'small text-danger mb-3'; detail.innerHTML = resultado.compatible ? 'Socket, memoria y potencia compatibles.' : resultado.errores.map(error => `<div>${escapeHtml(error)}</div>`).join(''); document.getElementById('buildList').innerHTML = Object.entries(seleccion).map(([tipo, item]) => `<div class="summary-item d-flex justify-content-between gap-2"><span class="text-truncate">${escapeHtml(item.nombre)}</span><strong class="component-price">${precioARS(item.precio)}</strong></div>`).join('') || '<span class="text-secondary">Todavía no hay componentes.</span>'; document.getElementById('saveBuild').disabled = !Object.keys(seleccion).length; }
        async function validar() { const response = await fetch('/api/builder/validate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ componentes: seleccion }) }); if (!response.ok) throw new Error('No se pudo validar el armado.'); renderResumen(await response.json()); }
        function renderSelected(tipo) { const item = seleccion[tipo]; if (!item) return ''; return `<div class="selected-card rounded-3 p-3 mb-4"><div class="d-flex align-items-center gap-3"><div class="flex-grow-1"><div class="small text-success">Selección actual</div><strong>${escapeHtml(item.nombre)}</strong><div class="component-price fw-bold">${precioARS(item.precio)}</div><div class="small text-secondary">${escapeHtml(item.tienda)}</div></div><button type="button" class="btn btn-outline-danger btn-sm" onclick="quitarSeleccion('${tipo}')">Quitar</button></div></div>`; }
        function renderCard(item) { const image = item.imagen ? `<img class="component-image" src="${escapeHtml(item.imagen)}" alt="${escapeHtml(item.nombre)}" referrerpolicy="no-referrer">` : '<div class="component-image d-flex align-items-center justify-content-center text-secondary small">Sin imagen</div>'; const badges = [item.socket, item.ram_type, item.watts ? `${item.watts}W` : '', item.tdp ? `${item.tdp}W TDP` : ''].filter(Boolean).map(meta => `<span class="badge tech-badge me-1 mb-1">${escapeHtml(meta)}</span>`).join(''); return `<article class="component-card"><div>${image}</div><div class="small text-info text-truncate mt-2">${escapeHtml(item.tienda)}</div><h3 class="h6 component-title my-1">${escapeHtml(item.nombre)}</h3><div class="mb-1">${badges || '<span class="small text-secondary">Oferta verificada</span>'}</div><div class="mt-auto"><div class="component-price fw-bold mb-2">${precioARS(item.precio)}</div><button class="btn btn-info btn-sm text-dark fw-semibold w-100" data-component-id="${escapeHtml(item.id)}">Elegir</button></div></article>`; }
        function mostrarReintento(message) { const cards = document.getElementById('cards'); cards.innerHTML = `<div class="alert alert-warning d-flex flex-wrap justify-content-between align-items-center gap-3"><span>${escapeHtml(message)}</span><button type="button" id="retrySearch" class="btn btn-outline-warning btn-sm">Reintentar búsqueda</button></div>`; document.getElementById('optionsPagination').innerHTML = ''; document.getElementById('retrySearch').addEventListener('click', () => cargarOpciones(document.getElementById('searchInput')?.value || '')); }
        function renderPagination(hasMore, page) { const pagination = document.getElementById('optionsPagination'); if (!pagination) return; pagination.innerHTML = hasMore ? `<button type="button" id="loadMoreOptions" class="btn btn-outline-info w-100 py-3">Cargar más opciones <span class="small text-secondary">(página ${page + 1})</span></button>` : (page > 1 ? '<div class="text-center text-secondary small py-3">No hay más opciones disponibles.</div>' : ''); const button = document.getElementById('loadMoreOptions'); if (button) button.addEventListener('click', () => cargarOpciones('', true)); }
        function vincularSeleccion() { const paso = pasos[pasoActual]; document.querySelectorAll('[data-component-id]').forEach(button => button.addEventListener('click', () => { const item = opcionesCargadas.find(option => option.id === button.dataset.componentId); if (!item) return; seleccion[paso.tipo] = item; omitidos.delete(paso.tipo); validar().catch(error => toast(error.message, 'danger')); if (pasoActual < pasos.length - 1) { pasoActual++; cargarPaso(); document.getElementById('wizardStep').scrollIntoView({ behavior: 'smooth', block: 'start' }); } })); }
        async function cargarOpciones(query = '', append = false, localOnly = false) { const paso = pasos[pasoActual], cards = document.getElementById('cards'); if (!cards) return; if (!append) { filtrosActivos.searchQuery = query; paginaOpciones = 1; opcionesCargadas = []; cards.innerHTML = '<div class="text-center text-secondary py-5"><span class="spinner-border spinner-border-sm me-2"></span>Cargando ofertas disponibles...</div>'; } else { paginaOpciones += 1; const moreButton = document.getElementById('loadMoreOptions'); if (moreButton) { moreButton.disabled = true; moreButton.textContent = 'Cargando más opciones...'; } } const filtros = filtrosCompatibles(); const consulta = paso.tipo === 'ram' && !filtrosActivos.searchQuery.trim() ? `memoria ram ${filtros.ram_type || 'ddr4 ddr5'}` : filtrosActivos.searchQuery; const params = new URLSearchParams({ tipo: paso.tipo, page: paginaOpciones, brand: filtrosActivos.brand, q: consulta, ...filtros }); if (localOnly) params.set('local', '1'); try { const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 25000); const response = await fetch(`/api/builder/options?${params}`, { signal: controller.signal }); clearTimeout(timeout); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.mensaje || `El backend respondió con error ${response.status}.`); if (!data.opciones?.length && !append) { mostrarReintento(data.mensaje || 'No encontramos componentes. Probá otro término.'); return; } opcionesCargadas = append ? [...opcionesCargadas, ...data.opciones] : data.opciones; cards.innerHTML = opcionesCargadas.map(renderCard).join(''); renderPagination(data.has_more, data.page || paginaOpciones); vincularSeleccion(); if (data.fuente === 'local' && data.mensaje) toast(data.mensaje, 'warning'); } catch (error) { if (append) paginaOpciones -= 1; if (!localOnly) { return cargarOpciones('', append, true); } const message = error.name === 'AbortError' ? 'La búsqueda local agotó el tiempo de espera (25 segundos).' : (error.message || 'No se pudo conectar con el backend.'); mostrarReintento(message); } }
        function quitarSeleccion(tipo) { delete seleccion[tipo]; omitidos.delete(tipo); validar().catch(() => {}); cargarPaso(); }
        async function cargarPaso() { const paso = pasos[pasoActual]; renderNav(); document.getElementById('backButton').disabled = pasoActual === 0; document.getElementById('skipButton').hidden = paso.tipo === 'summary'; document.getElementById('nextButton').hidden = paso.tipo === 'summary'; if (paso.tipo === 'summary') { document.getElementById('wizardStep').innerHTML = `<div class="component-panel rounded-3 p-4"><div class="d-flex justify-content-between align-items-start gap-3"><div><h2 class="h4">${paso.titulo}</h2><p class="text-secondary">${paso.hint}</p></div><span class="badge text-bg-success">Listo para revisar</span></div><div class="mt-4">${Object.entries(seleccion).map(([tipo, item]) => `<div class="summary-item d-flex justify-content-between align-items-center gap-3"><div><div class="small text-info">${escapeHtml(pasos.find(step => step.tipo === tipo)?.titulo || tipo)}</div><strong>${escapeHtml(item.nombre)}</strong><div class="small text-secondary">${escapeHtml(item.tienda)}</div></div><div class="text-end"><div class="component-price fw-bold">${precioARS(item.precio)}</div><button class="btn btn-link btn-sm text-danger p-0" onclick="quitarSeleccion('${tipo}')">Quitar</button></div></div>`).join('') || '<p class="text-secondary">No seleccionaste componentes.</p>'}</div></div>`; await validar(); return; } const vendor = paso.tipo === 'cpu' ? '<div class="btn-group mb-3"><button class="btn btn-outline-secondary vendor-filter" data-brand="">Todos</button><button class="btn btn-outline-info vendor-filter" data-brand="AMD">AMD</button><button class="btn btn-outline-info vendor-filter" data-brand="Intel">Intel</button></div>' : ''; document.getElementById('wizardStep').innerHTML = `<div class="component-panel rounded-3 p-4">${renderSelected(paso.tipo)}<div class="d-flex flex-wrap justify-content-between gap-2"><div><div class="small text-info text-uppercase">Paso ${pasoActual + 1} de ${pasos.length - 1}</div><h2 class="h4 mb-1">${paso.titulo}</h2><p class="text-secondary mb-0">${paso.hint}</p></div><span class="badge text-bg-dark align-self-start">Ofertas en vivo</span></div>${vendor}<form id="searchForm" class="input-group my-4"><input id="searchInput" class="form-control" placeholder="${paso.placeholder}" value="${escapeHtml(filtrosActivos.searchQuery)}"><button class="btn btn-outline-info">Buscar ofertas</button></form><div id="cards" class="component-grid"></div><div id="optionsPagination" class="mt-4"></div></div>`; document.getElementById('searchForm').addEventListener('submit', event => { event.preventDefault(); cargarOpciones(document.getElementById('searchInput').value); }); document.querySelectorAll('.vendor-filter').forEach(button => button.addEventListener('click', () => { filtrosActivos.brand = button.dataset.brand; cargarOpciones(filtrosActivos.searchQuery); })); await cargarOpciones(filtrosActivos.searchQuery); }
        document.getElementById('nextButton').addEventListener('click', () => { const tipo = pasos[pasoActual].tipo; if (!seleccion[tipo] && !omitidos.has(tipo)) { toast('Seleccioná un componente o elegí “Omitir paso”.', 'warning'); return; } if (pasoActual < pasos.length - 1) { pasoActual++; cargarPaso(); } });
        document.getElementById('backButton').addEventListener('click', () => { if (pasoActual > 0) { pasoActual--; cargarPaso(); } });
        document.getElementById('skipButton').addEventListener('click', () => { const tipo = pasos[pasoActual].tipo; delete seleccion[tipo]; omitidos.add(tipo); if (pasoActual < pasos.length - 1) { pasoActual++; cargarPaso(); } });
        document.getElementById('saveBuild').addEventListener('click', async () => { const response = await fetch('/api/builder/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ componentes: seleccion }) }); const data = await response.json(); toast(response.ok ? 'Presupuesto guardado en seguimiento' : (data.mensaje || 'No se pudo guardar'), response.ok ? 'success' : 'danger'); });
        document.getElementById('printBuild').addEventListener('click', () => { const rows = Object.entries(seleccion).map(([tipo, item]) => `<div class="line"><span>${escapeHtml(pasos.find(step => step.tipo === tipo)?.titulo || tipo)}<br><b>${escapeHtml(item.nombre)}</b></span><strong>${precioARS(item.precio)}</strong></div>`).join(''); const total = precioARS(Object.values(seleccion).reduce((sum, item) => sum + Number(item.precio || 0), 0)); const ticket = window.open('', '_blank', 'width=720,height=900'); if (!ticket) return; ticket.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Presupuesto de PC</title><style>body{font:14px Arial,sans-serif;color:#111;max-width:620px;margin:40px auto;padding:0 24px}.head{border-bottom:2px solid #111;padding-bottom:18px;margin-bottom:20px}.line{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #ddd;padding:13px 0}.line strong{white-space:nowrap}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:bold;margin-top:24px;padding-top:16px;border-top:3px solid #111}@media print{body{margin:0}}</style></head><body><div class="head"><h1>Presupuesto de PC</h1><div>Hardware Tracker · ${new Date().toLocaleDateString('es-AR')}</div></div>${rows || '<p>No hay componentes seleccionados.</p>'}<div class="total"><span>Total</span><span>${total}</span></div><script>window.onload=()=>window.print();<\/script></body></html>`); ticket.document.close(); });
        cargarPaso(); validar().catch(() => {});
    </script>
</body>
</html>
