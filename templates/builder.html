<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armador de PC | Hardware Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cyan: #00f5d4; --lime: #b8ff00; }
        body { background: radial-gradient(circle at 85% 0, rgba(0,245,212,.1), transparent 32rem), #101316; }
        .builder-hero { border-left: 4px solid var(--cyan); }
        .step-link { color: #9ba6ad; cursor: pointer; }
        .step-link.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); }
        .component-card, .summary-card { background: rgba(31,36,41,.94); border: 1px solid rgba(255,255,255,.1); }
        .component-card { transition: transform .2s, border-color .2s; }
        .component-card:hover { transform: translateY(-3px); border-color: var(--cyan); }
        .component-image { height: 160px; object-fit: contain; background: rgba(255,255,255,.03); }
        .component-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5rem; }
        .summary-card { position: sticky; top: 1rem; }
        .component-price { color: var(--lime); }
        .selected-card { border-color: var(--lime); background: rgba(184,255,0,.08); }
        .progress { height: 12px; background: #252c31; }
        .progress-bar { background: linear-gradient(90deg, var(--cyan), var(--lime)); }
    </style>
</head>
<body class="text-light">
    <nav class="navbar navbar-expand-lg border-bottom border-secondary bg-body-tertiary"><div class="container"><a class="navbar-brand fw-bold" href="/">Hardware Tracker</a><div class="d-flex gap-2"><a href="/seguimiento" class="btn btn-outline-warning btn-sm">Seguimiento</a><a href="/" class="btn btn-outline-primary btn-sm">Buscador</a></div></div></nav>
    <main class="container py-5">
        <header class="builder-hero ps-3 mb-4"><p class="text-info text-uppercase small fw-semibold mb-1">Asistente de armado</p><h1 class="display-6 fw-bold mb-2">Armador de PC</h1><p class="text-secondary mb-0">Ofertas reales, compatibilidad tecnica y presupuesto en un solo lugar.</p></header>
        <nav class="d-flex flex-wrap gap-3 border-bottom border-secondary mb-4 pb-2" aria-label="Pasos del armado">
            <button class="btn btn-link text-decoration-none p-0 step-link active" data-step="0">1. CPU</button><button class="btn btn-link text-decoration-none p-0 step-link" data-step="1">2. Motherboard</button><button class="btn btn-link text-decoration-none p-0 step-link" data-step="2">3. RAM</button><button class="btn btn-link text-decoration-none p-0 step-link" data-step="3">4. GPU</button><button class="btn btn-link text-decoration-none p-0 step-link" data-step="4">5. Fuente</button><button class="btn btn-link text-decoration-none p-0 step-link" data-step="5">6. Storage</button><button class="btn btn-link text-decoration-none p-0 step-link" data-step="6">7. Resumen</button>
        </nav>
        <div class="row g-4"><section class="col-lg-8"><div id="wizardStep"></div><div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><button id="backButton" type="button" class="btn btn-outline-secondary">Atras</button><button id="skipButton" type="button" class="btn btn-outline-warning">Omitir este paso</button><button id="nextButton" type="button" class="btn btn-primary">Siguiente</button></div></section>
            <aside class="col-lg-4"><div class="summary-card rounded-3 p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Resumen del Presupuesto</h2><span id="statusBadge" class="badge text-bg-secondary">En espera</span></div><div class="mb-4"><div class="text-secondary small">Precio Total</div><div id="totalPrice" class="display-6 fw-bold component-price">$0</div></div><div class="mb-2 d-flex justify-content-between"><span class="text-secondary">Consumo estimado</span><strong><span id="powerUsage">150</span>W / <span id="psuCapacity">-</span></strong></div><div class="progress mb-2"><div id="powerBar" class="progress-bar" style="width:0%"></div></div><div id="compatibilityDetails" class="small text-secondary mb-3">Completá el asistente para validar el armado.</div><div id="buildList" class="small text-secondary"></div><button id="saveBuild" type="button" class="btn btn-success w-100 mt-4" disabled>Guardar todo este Build</button></div></aside>
        </div>
    </main>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const pasos = [
            { tipo: 'cpu', titulo: 'Procesador', hint: 'Buscá un procesador real. El contexto de categoria se aplica automaticamente.', placeholder: 'Ej: Ryzen 5600, i5 12400' },
            { tipo: 'motherboard', titulo: 'Placa Madre', hint: 'Resultados filtrados por el socket del procesador.', placeholder: 'Ej: B650, B760' },
            { tipo: 'ram', titulo: 'Memoria RAM', hint: 'Resultados filtrados por DDR4 o DDR5.', placeholder: 'Ej: DDR5 6000' },
            { tipo: 'gpu', titulo: 'Placa de Video', hint: 'Ofertas actuales de GPUs.', placeholder: 'Ej: RTX 4060, RX 7600' },
            { tipo: 'psu', titulo: 'Fuente de Poder', hint: 'Solo se recomiendan fuentes con watts suficientes.', placeholder: 'Ej: 650W Gold' },
            { tipo: 'storage', titulo: 'Almacenamiento', hint: 'SSD y NVMe disponibles en el agregador.', placeholder: 'Ej: SSD NVMe 1TB' },
            { tipo: 'summary', titulo: 'Resumen final', hint: 'Revisá el armado completo antes de guardarlo.' }
        ];
        let pasoActual = 0;
        const seleccion = {};

        const precioARS = value => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(value);
        function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }
        function toast(message, type = 'success') { const el = document.createElement('div'); el.className = `toast align-items-center text-bg-${type} border-0`; el.innerHTML = `<div class="d-flex"><div class="toast-body">${escapeHtml(message)}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`; document.getElementById('toastContainer').appendChild(el); const instance = new bootstrap.Toast(el, { delay: 3500 }); el.addEventListener('hidden.bs.toast', () => el.remove()); instance.show(); }
        function filtrosCompatibles() { const cpu = seleccion.cpu, mother = seleccion.motherboard, gpu = seleccion.gpu; return { socket: (mother || cpu || {}).socket || '', ram_type: (mother || cpu || {}).ram_type || '', recommended_watts: (cpu?.tdp || 0) + (gpu?.tdp || 0) + 150 }; }
        function quitarSeleccion(tipo) { delete seleccion[tipo]; const dependientes = { cpu: ['motherboard', 'ram'], motherboard: ['ram'] }; (dependientes[tipo] || []).forEach(dependiente => delete seleccion[dependiente]); validar().catch(() => {}); cargarPaso(); }
        function renderSeleccionada(tipo) { const item = seleccion[tipo]; if (!item) return ''; const image = item.imagen ? `<img src="${escapeHtml(item.imagen)}" alt="" style="width:64px;height:64px;object-fit:contain">` : ''; return `<div class="selected-card rounded-3 p-3 mb-4"><div class="d-flex align-items-center gap-3">${image}<div class="flex-grow-1"><div class="small text-success">Seleccion actual</div><strong>${escapeHtml(item.nombre)}</strong><div class="component-price fw-bold">${precioARS(item.precio)}</div><div class="small text-secondary">${escapeHtml(item.tienda)}</div></div><button type="button" class="btn btn-danger btn-sm" onclick="quitarSeleccion('${tipo}')">Quitar seleccion</button></div></div>`; }
        function renderResumen(resultado) { document.getElementById('totalPrice').textContent = precioARS(resultado.precio_total); document.getElementById('powerUsage').textContent = resultado.consumo_estimado; document.getElementById('psuCapacity').textContent = resultado.fuente_watts || '-'; document.getElementById('powerBar').style.width = `${resultado.fuente_watts ? Math.min(100, resultado.consumo_estimado / resultado.fuente_watts * 100) : 0}%`; const badge = document.getElementById('statusBadge'), detail = document.getElementById('compatibilityDetails'); if (resultado.compatible) { badge.className = 'badge bg-success'; badge.textContent = 'Compatible'; detail.className = 'small text-success mb-3'; detail.textContent = 'Socket, memoria y potencia compatibles.'; } else { badge.className = 'badge bg-danger'; badge.textContent = 'Incompatibilidad detectada'; detail.className = 'small text-danger mb-3'; detail.innerHTML = resultado.errores.map(error => `<div>• ${escapeHtml(error)}</div>`).join(''); } document.getElementById('buildList').innerHTML = Object.entries(seleccion).map(([tipo, item]) => `<div class="d-flex justify-content-between align-items-center border-bottom border-secondary py-2"><span class="text-truncate me-2">${escapeHtml(item.nombre)}</span><button class="btn btn-link btn-sm text-danger p-0" title="Quitar" onclick="quitarSeleccion('${tipo}')">🗑️</button></div>`).join(''); document.getElementById('saveBuild').disabled = !Object.keys(seleccion).length; }
        async function validar() { const response = await fetch('/api/builder/validate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ componentes: seleccion }) }); if (!response.ok) throw new Error('No se pudo validar el armado.'); renderResumen(await response.json()); }
        function renderCard(item) { const image = item.imagen ? `<img class="card-img-top component-image" src="${escapeHtml(item.imagen)}" alt="${escapeHtml(item.nombre)}" referrerpolicy="no-referrer">` : '<div class="component-image d-flex align-items-center justify-content-center fs-1">Imagen</div>'; const meta = [item.socket, item.ram_type, item.tdp ? `${item.tdp}W TDP` : ''].filter(Boolean).join(' · '); return `<article class="component-card card h-100 overflow-hidden"><div>${image}</div><div class="card-body d-flex flex-column"><div class="small text-info mb-1">${escapeHtml(item.tienda)}</div><h3 class="h6 component-title">${escapeHtml(item.nombre)}</h3><p class="small text-secondary mb-3">${escapeHtml(meta || 'Metadatos inferidos')}</p><div class="mt-auto"><div class="component-price fw-bold fs-5 mb-2">${precioARS(item.precio)}</div><button class="btn btn-primary w-100" data-component-id="${escapeHtml(item.id)}">Agregar</button></div></div></article>`; }
        function mostrarReintento(message) { const cards = document.getElementById('cards'); cards.innerHTML = `<div class="col-12"><div class="alert alert-warning d-flex flex-wrap justify-content-between align-items-center gap-3"><span>${escapeHtml(message)}</span><button type="button" id="retrySearch" class="btn btn-outline-warning btn-sm">Reintentar búsqueda</button></div></div>`; document.getElementById('retrySearch').addEventListener('click', () => cargarOpciones(document.getElementById('searchInput')?.value || '')); }
        async function cargarOpciones(query = '') { const paso = pasos[pasoActual], cards = document.getElementById('cards'); if (!cards) return; const params = new URLSearchParams({ tipo: paso.tipo, q: query, ...filtrosCompatibles() }); cards.innerHTML = '<div class="col-12 text-center text-secondary py-5"><span class="spinner-border spinner-border-sm me-2"></span>Cargando opciones disponibles...</div>'; try { const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 15000); const response = await fetch(`/api/builder/options?${params}`, { signal: controller.signal }); clearTimeout(timeout); const data = await response.json(); if (!response.ok) throw new Error(data.mensaje || 'No se pudieron cargar ofertas.'); if (!data.opciones.length) { mostrarReintento('No encontramos componentes. Probá otro término.'); return; } cards.innerHTML = data.opciones.map(renderCard).join(''); cards.querySelectorAll('[data-component-id]').forEach(button => button.addEventListener('click', () => { const item = data.opciones.find(option => option.id === button.dataset.componentId); seleccion[paso.tipo] = item; validar().catch(error => toast(error.message, 'danger')); cargarPaso(); })); } catch (error) { mostrarReintento(error.name === 'AbortError' ? 'La búsqueda demoró demasiado.' : (error.message || 'No se pudo conectar con el scraper.')); } }
        async function cargarPaso() { const paso = pasos[pasoActual]; document.querySelectorAll('.step-link').forEach(link => link.classList.toggle('active', Number(link.dataset.step) === pasoActual)); document.getElementById('backButton').disabled = pasoActual === 0; document.getElementById('skipButton').hidden = pasoActual >= 6; document.getElementById('nextButton').hidden = pasoActual >= 6; if (paso.tipo === 'summary') { document.getElementById('wizardStep').innerHTML = `<div class="component-card rounded-3 p-4"><h2 class="h4">${paso.titulo}</h2><p class="text-secondary">${paso.hint}</p><div class="row g-3">${Object.entries(seleccion).map(([tipo, item]) => `<div class="col-md-6"><div class="border border-secondary rounded p-3"><div class="small text-info">${escapeHtml(item.tienda)}</div><strong>${escapeHtml(item.nombre)}</strong><div class="component-price">${precioARS(item.precio)}</div><button class="btn btn-outline-danger btn-sm mt-2" onclick="quitarSeleccion('${tipo}')">Quitar seleccion</button></div></div>`).join('') || '<p class="text-secondary">No seleccionaste componentes.</p>'}</div></div>`; await validar(); return; } const vendor = paso.tipo === 'cpu' ? '<div class="btn-group mb-3"><button class="btn btn-outline-secondary vendor-filter" data-query="">Todos</button><button class="btn btn-outline-info vendor-filter" data-query="AMD">AMD</button><button class="btn btn-outline-info vendor-filter" data-query="Intel">Intel</button></div>' : ''; document.getElementById('wizardStep').innerHTML = `<div class="component-card rounded-3 p-4">${renderSeleccionada(paso.tipo)}<div class="d-flex flex-wrap justify-content-between gap-2"><div><h2 class="h4">${paso.titulo}</h2><p class="text-secondary">${paso.hint}</p></div><span class="badge text-bg-dark">Datos en vivo</span></div>${vendor}<form id="searchForm" class="input-group mb-4"><input id="searchInput" class="form-control" placeholder="${paso.placeholder}"><button class="btn btn-outline-primary">Buscar ofertas</button></form><div id="cards" class="row row-cols-1 row-cols-md-2 g-3"></div></div>`; document.getElementById('searchForm').addEventListener('submit', event => { event.preventDefault(); cargarOpciones(document.getElementById('searchInput').value); }); document.querySelectorAll('.vendor-filter').forEach(button => button.addEventListener('click', () => cargarOpciones(button.dataset.query))); await cargarOpciones(); }
        document.getElementById('nextButton').addEventListener('click', () => { if (pasoActual < 6) { pasoActual++; cargarPaso(); } }); document.getElementById('backButton').addEventListener('click', () => { if (pasoActual > 0) { pasoActual--; cargarPaso(); } }); document.getElementById('skipButton').addEventListener('click', () => { delete seleccion[pasos[pasoActual].tipo]; if (pasoActual < 6) { pasoActual++; cargarPaso(); } }); document.querySelectorAll('.step-link').forEach(link => link.addEventListener('click', () => { pasoActual = Number(link.dataset.step); cargarPaso(); })); document.getElementById('saveBuild').addEventListener('click', async () => { const response = await fetch('/api/builder/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ componentes: seleccion }) }); const data = await response.json(); if (response.ok) toast('Build guardado en seguimiento'); else toast(data.mensaje || 'No se pudo guardar', 'danger'); }); cargarPaso(); validar().catch(() => {});
    </script>
</body>
</html>
